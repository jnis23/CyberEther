---
version: 2
title: bladeRF Dual RX
summary: Receive both bladeRF 2.0 antenna ports.
author: CyberEther
license: MIT
description: One SDR block receives RX1 and RX2 simultaneously and feeds two spectrum analyzers. Select a bladeRF 2.0 in Device to start.
graph:
  - name: note
    module: note
    device: cpu
    runtime: native
    provider: generic
    config:
      content: |-
        # bladeRF Dual RX
        Select a **bladeRF 2.0** in the SDR block's **Device** dropdown.
        **Dual RX** is enabled in this example. Connect antennas to **RX1** and **RX2**.

        Both outputs share Frequency and Sample Rate. Each has its own gain controls.
        Both displays receive matching sample intervals; a slow processing chain can
        cause both channels to drop older samples together. Watch Buffer Loss.

        Dual RX requires FPGA v0.15.3 or newer for correct timestamps.
        The original bladeRF has one receiver and cannot run this example.
        Dual-channel reception preserves sample alignment; antenna phase/gain calibration is separate.
    meta:
      node:
        x: 40
        y: 550
        width: 360
        height: 300
  - name: radio
    module: sdr
    device: cpu
    runtime: native
    provider: generic
    config:
      deviceString: ''
      dualRx: true
      frequency: 96900000
      sampleRate: 2000000
      automaticGain: true
      automaticGain2: true
      biasTee: false
    meta:
      node:
        x: 40
        y: 40
        width: 340
        height: 0
  - name: rx1
    module: spectrum_analyzer
    device: cpu
    runtime: native
    provider: generic
    config: {}
    input:
      buffer: '${graph.radio.output.signal}'
    meta:
      node:
        x: 450
        y: 40
        width: 800
        height: 0
  - name: rx2
    module: spectrum_analyzer
    device: cpu
    runtime: native
    provider: generic
    config: {}
    input:
      buffer: '${graph.radio.output.signal2}'
    meta:
      node:
        x: 450
        y: 550
        width: 800
        height: 0
